<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>總經與美股趨勢儀表板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: #2d2d2d; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #fff; margin-bottom: 20px; }
        
        .controls-panel { display: flex; justify-content: space-between; align-items: center; background: #3d3d3d; padding: 15px; border-radius: 8px; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .control-group { display: flex; align-items: center; gap: 10px; }
        .control-group label { font-weight: bold; color: #ccc; }
        select, input[type="number"] { padding: 8px; border-radius: 5px; border: 1px solid #555; background: #222; color: #fff; font-size: 14px; }
        input[type="number"] { width: 70px; }
        
        .btn-reset { padding: 10px 20px; background-color: #007acc; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-reset:hover { background-color: #005999; }

        .chart-wrapper { background: #222; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #444; }
        .chart-container { position: relative; height: 35vh; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 全球資產與總經趨勢分析</h2>
    
    <div class="controls-panel">
        <div class="control-group">
            <label>📈 上方圖表 (ETF/資產)：</label>
            <select id="etfSelect" onchange="updateEtfChart()">
                <option value="SPY.csv">SPY (標普500)</option>
                <option value="QQQ.csv">QQQ (納斯達克)</option>
                <option value="SOXX.csv">SOXX (半導體)</option>
                <option value="Gold_GLD.csv">GLD (黃金)</option>
                <option value="Silver_SLV.csv">SLV (白銀)</option>
                <option value="Bitcoin_IBIT.csv">IBIT (比特幣)</option>
            </select>
            <label>均線週期：</label>
            <input type="number" id="etfMaPeriod" value="60" min="1" max="1000" onchange="updateEtfChart()">
        </div>

        <div class="control-group">
            <label>📉 下方圖表 (公債殖利率)：</label>
            <select id="yieldSelect" onchange="updateYieldChart()">
                <option value="10Y_Yield.csv">10年期公債殖利率</option>
                <option value="30Y_Yield.csv">30年期公債殖利率</option>
            </select>
            <label>均線週期：</label>
            <input type="number" id="yieldMaPeriod" value="200" min="1" max="1000" onchange="updateYieldChart()">
        </div>

        <button class="btn-reset" onclick="resetChartsZoom()">🔄 重設縮放</button>
    </div>

    <div class="chart-wrapper">
        <div class="chart-container">
            <canvas id="etfChart"></canvas>
        </div>
    </div>

    <div class="chart-wrapper">
        <div class="chart-container">
            <canvas id="yieldChart"></canvas>
        </div>
    </div>
</div>

<script>
    let etfChartInstance = null;
    let yieldChartInstance = null;
    const dataCache = {};

    // =========================================
    // 1. 同步 X 軸縮放與平移的邏輯
    // =========================================
    function syncChartsScale(sourceChart) {
        const targetChart = sourceChart === etfChartInstance ? yieldChartInstance : etfChartInstance;
        if (!targetChart) return;
        // 把目標圖表的 X 軸範圍鎖定成跟來源圖表一模一樣
        targetChart.options.scales.x.min = sourceChart.scales.x.min;
        targetChart.options.scales.x.max = sourceChart.scales.x.max;
        targetChart.update('none'); // 無縫更新，不觸發動畫
    }

    const sharedZoomOptions = {
        pan: {
            enabled: true,
            mode: 'x',
            onPan: ({ chart }) => syncChartsScale(chart)
        },
        zoom: {
            wheel: { enabled: true },
            pinch: { enabled: true },
            mode: 'x',
            onZoom: ({ chart }) => syncChartsScale(chart)
        }
    };

    // =========================================
    // 2. 自訂擴充套件：跨圖表垂直十字線
    // =========================================
    let crosshairX = null; // 全域變數，紀錄滑鼠目前的 X 座標

    const crosshairPlugin = {
        id: 'crosshair',
        afterEvent: (chart, args) => {
            const { event, inChartArea } = args;
            if (event.type === 'mousemove') {
                if (inChartArea) {
                    crosshairX = event.x; // 更新滑鼠位置
                    // 呼叫另一張圖表重新繪製以顯示十字線
                    const otherChart = chart === etfChartInstance ? yieldChartInstance : etfChartInstance;
                    if (otherChart) otherChart.draw();
                } else {
                    crosshairX = null; // 滑鼠離開圖表區域時清除
                    const otherChart = chart === etfChartInstance ? yieldChartInstance : etfChartInstance;
                    if (otherChart) otherChart.draw();
                }
            } else if (event.type === 'mouseout') {
                crosshairX = null;
                const otherChart = chart === etfChartInstance ? yieldChartInstance : etfChartInstance;
                if (otherChart) otherChart.draw();
            }
        },
        afterDraw: (chart) => {
            if (crosshairX !== null) {
                const ctx = chart.ctx;
                const { top, bottom, left, right } = chart.chartArea;
                
                // 確保垂直線只畫在圖表內部區域
                if (crosshairX >= left && crosshairX <= right) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(crosshairX, top);
                    ctx.lineTo(crosshairX, bottom);
                    ctx.lineWidth = 1.5;
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.setLineDash([5, 5]); // 設定虛線樣式
                    ctx.stroke();
                    ctx.restore();
                }
            }
        }
    };

    // =========================================
    // 3. 資料處理與圖表渲染
    // =========================================
    function calculateSMA(data, period) {
        const sma = [];
        for (let i = 0; i < data.length; i++) {
            if (i < period - 1) sma.push(null);
            else {
                let sum = 0;
                for (let j = 0; j < period; j++) sum += data[i - j];
                sma.push(sum / period);
            }
        }
        return sma;
    }

    function parseCSV(csvText) {
        const lines = csvText.trim().split('\n');
        const dates = [];
        const prices = [];
        for(let i = 1; i < lines.length; i++) {
            const row = lines[i].split(',');
            if(row.length >= 2 && row[1]) {
                dates.push(row[0]);
                prices.push(parseFloat(row[1]));
            }
        }
        return { dates, prices };
    }

    async function fetchData(filename) {
        if (dataCache[filename]) return dataCache[filename];
        try {
            const response = await fetch(`./data/${filename}`);
            if (!response.ok) throw new Error("File not found");
            const parsedData = parseCSV(await response.text());
            dataCache[filename] = parsedData;
            return parsedData;
        } catch (error) {
            console.error(`讀取 ${filename} 失敗:`, error);
            return null;
        }
    }

    // 共同的 X 軸設定
    const commonXAxis = { ticks: { color: '#ccc', maxTicksLimit: 15 }, grid: { color: 'rgba(255, 255, 255, 0.05)' } };

    async function updateEtfChart() {
        const filename = document.getElementById('etfSelect').value;
        const maPeriod = parseInt(document.getElementById('etfMaPeriod').value) || 60;
        const labelName = document.getElementById('etfSelect').options[document.getElementById('etfSelect').selectedIndex].text;
        
        const data = await fetchData(filename);
        if (!data) return;
        const maData = calculateSMA(data.prices, maPeriod);

        if (etfChartInstance) etfChartInstance.destroy();
        etfChartInstance = new Chart(document.getElementById('etfChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: data.dates,
                datasets: [
                    { label: `${labelName} 價格`, data: data.prices, borderColor: 'rgba(54, 162, 235, 0.9)', borderWidth: 1.5, pointRadius: 0 },
                    { label: `${maPeriod}日 均線`, data: maData, borderColor: 'rgba(255, 159, 64, 1)', borderWidth: 1.5, pointRadius: 0, borderDash: [5, 5] }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
                plugins: { zoom: sharedZoomOptions, legend: { labels: { color: '#ccc' } } },
                scales: {
                    x: commonXAxis,
                    // 隱藏的左軸(佔位)，讓右軸價格能完美對齊下方圖表
                    yLeft: { position: 'left', ticks: { display: false }, grid: { drawBorder: false, color: 'transparent' } },
                    yRight: { position: 'right', ticks: { color: '#ccc' }, grid: { color: 'rgba(255, 255, 255, 0.1)' } }
                }
            },
            plugins: [crosshairPlugin] // 載入十字線套件
        });
    }

    async function updateYieldChart() {
        const filename = document.getElementById('yieldSelect').value;
        const maPeriod = parseInt(document.getElementById('yieldMaPeriod').value) || 200;
        const labelName = document.getElementById('yieldSelect').options[document.getElementById('yieldSelect').selectedIndex].text;
        
        const data = await fetchData(filename);
        if (!data) return;
        const maData = calculateSMA(data.prices, maPeriod);

        if (yieldChartInstance) yieldChartInstance.destroy();
        yieldChartInstance = new Chart(document.getElementById('yieldChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: data.dates,
                datasets: [
                    { label: `${labelName} (%)`, data: data.prices, borderColor: 'rgba(255, 99, 132, 0.9)', borderWidth: 1.5, pointRadius: 0 },
                    { label: `${maPeriod}日 均線`, data: maData, borderColor: 'rgba(255, 205, 86, 1)', borderWidth: 1.5, pointRadius: 0, borderDash: [5, 5] }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
                plugins: { zoom: sharedZoomOptions, legend: { labels: { color: '#ccc' } } },
                scales: {
                    x: commonXAxis,
                    // 殖利率放左軸，右側放一個隱藏軸(佔位)
                    yLeft: { position: 'left', ticks: { color: '#ccc' }, grid: { color: 'rgba(255, 255, 255, 0.1)' } },
                    yRight: { position: 'right', ticks: { display: false }, grid: { drawBorder: false, color: 'transparent' } }
                }
            },
            plugins: [crosshairPlugin] // 載入十字線套件
        });
    }

    function resetChartsZoom() {
        if (etfChartInstance) {
            etfChartInstance.options.scales.x.min = undefined;
            etfChartInstance.options.scales.x.max = undefined;
            etfChartInstance.update();
        }
        if (yieldChartInstance) {
            yieldChartInstance.options.scales.x.min = undefined;
            yieldChartInstance.options.scales.x.max = undefined;
            yieldChartInstance.update();
        }
    }

    window.onload = () => {
        updateEtfChart();
        updateYieldChart();
    };
</script>

</body>
</html>
